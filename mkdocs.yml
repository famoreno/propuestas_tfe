site_name: Trabajos Fin Estudios
site_url: https://famoreno.github.io/propuestas_tfe/

theme:
  name: material
  language: es
  custom_dir: docs/overrides
  # logo: material/school
  # favicon: material/school

  palette:
    - scheme: default
      primary: custom 
      accent: custom

  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - "Inicio": index.md
  - "Información general": contenidos/index.md # introducción, normativa, plantilla latex overleaf
  - "Líneas":
    - "Robótica móvil": contenidos/robotica/index.md
    - "Automatización industrial": contenidos/automatizacion/index.md
    - "Visión artificial": contenidos/vision/index.md
    - "Salud": contenidos/salud/index.md
    - "Archivo": contenidos/archivo/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.snippets:
      check_paths: true
      base_path: !relative $docs_dir
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - macros

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/famoreno/propuestas_tfe

extra_css:
  - stylesheets/extra.css
  - stylesheets/tfe.css

extra_javascript:
  - javascripts/ui-course.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js